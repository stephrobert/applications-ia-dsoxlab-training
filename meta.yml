# Catalogue applications-ia-dsoxlab-training, décrit par le contrat v1 de dsoxlab.
#
# `repo.id` sert de clé pour l'état local de ce catalogue : le changer
# déplace ces emplacements.
schema_version: 1

repo:
  id: applications-ia-dsoxlab-training
  category: applications-ia
  title: "Governing and Securing AI-Generated Applications: verifiable labs"
  blog_url: "https://www.stephane-robert.info/docs/developper/vibe-coding/"
  issues_url: "https://github.com/stephrobert/applications-ia-dsoxlab-training/issues"
  description: >-
    Verifiable labs for the course on governing and securing applications built
    with AI help: classify an application, frame it with a contract, vibe code
    with a method and a harness, then close the delivery chain. No lab calls a
    real AI service or needs an API key: the agent and its answers are
    simulated and deterministic.

# Où remettre une preuve d'apprentissage, si ce catalogue a un portail. En
# `https` : le lien porte les résultats d'un apprenant. dsoxlab n'envoie rien :
# il affiche une adresse, et l'apprenant décide.
#
# learning:
#   portal_url: https://formation.example.org/mon-apprentissage/

# Un catalogue sans lab `vm` n'a pas besoin de bloc `infra:`. Décommente-le le
# jour où un lab déclare `runtime.type: vm`.
#
# infra:
#   provider: kvm
#   network: applications-ia-dsoxlab-training-net
#   cidr: 10.10.10.0/24
#   hosts:
#     - name: hote.lab
#       distro: alma10

sections:
  - id: niveau-1
    title: "Level 1: classify, frame and vibe code with a method"
    description: >-
      Exercises on provided files, in a local shell: classify an application,
      write its contract, review a diff against a specification, check the
      dependencies an agent proposes, and set up a harness.
    labs:
      - vc-classifier-applications
      - vc-contrat-applicatif
      - vc-boucle-methode
      - vc-specification-agent
      - vc-reprise-session
      - vc-paquet-inexistant
      - vc-contexte-agent
      - vc-harness-agent-ia
      - vc-epreuve-classification
  - id: claude-code
    title: "Claude Code: one mechanism per lab"
    description: >-
      Exercises on provided files, in a local shell and without Claude Code:
      each lab isolates one mechanism of Claude Code (a hook, a rule, a
      server, a subagent) and proves on a simulator what it does and what it
      does not do.
    labs:
      - cc-hook-qui-echoue
      - cc-serveur-mcp-non-approuve
      - cc-subagent-relecteur-borne
      - cc-skill-de-validation
