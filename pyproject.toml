# Ce dépôt n'est pas un paquet : ce fichier ne sert qu'à configurer les outils.
# dsoxlab s'installe en outil autonome (`uv tool install dsoxlab`) et apporte
# lui-même pytest et pytest-testinfra, pour qu'un catalogue n'ait aucun outil
# de test à installer.

[project]
name = "applications-ia-dsoxlab-training"
version = "0.1.0"
description = "À remplir."
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests", "labs"]
# `challenge/work` contient le travail de l'apprenant : il n'est jamais
# collecté, sous peine de ramasser ses fichiers temporaires comme des tests.
norecursedirs = ["challenge/work", ".git", ".venv"]

[tool.ruff]
line-length = 100
target-version = "py311"
# `solution/` est chiffrée (ansible-vault) : ce n'est plus du Python lisible.
# `fixtures/` est le point de départ de l'apprenant et `challenge/work` ce qu'il
# écrit : le lint du catalogue n'y touche pas (comme python-dsoxlab-training).
exclude = ["labs/*/solution", "labs/*/fixtures", "labs/*/challenge/work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# S101 : `assert` est l'outil de travail d'un test, pas un défaut.
# scripts/ est l'outillage du formateur, repris de python-dsoxlab-training : il
# lance dsoxlab, pytest et ansible-vault, des outils de confiance (S603, S607).
per-file-ignores = { "labs/**/tests/*.py" = ["S101"], "tests/*.py" = ["S101"], "scripts/*.py" = ["E501", "S101", "S603", "S607"] }
