title: "Reprendre une session de code interrompue à partir de Git, pas de la mémoire"
description: |
  Une session de code sur le portail-achats s'est arrêtée au milieu d'une
  tranche. Elle a laissé des commits, du travail non commité et un journal
  d'avancement qui ne colle pas tout à fait au dépôt. Partez de l'état réel
  de Git, décidez de ce que vous gardez et de ce que vous écartez, terminez
  la tranche sans toucher à la spécification ni aux tests des critères déjà
  faits, et laissez un journal auquel la session suivante peut se fier.
doc_url: https://www.stephane-robert.info/docs/ia/applications-generees-par-ia/
criteria:
  - id: tranche-terminee
    label: "Les critères en cours passent dans le dernier commit, et les critères déjà faits passent toujours"
  - id: reprise-depuis-git
    label: "L'historique est conservé, rien ne reste non commité, et le journal dit ce qu'est devenu chaque fichier non commité"
  - id: exigences-intactes
    label: "SPEC.md et les tests des critères déjà faits sont identiques avant et après la reprise"
  - id: journal-a-jour
    label: "PROGRESS.md donne l'état réel de chaque critère, le commit de chaque critère fait, et une prochaine action"
